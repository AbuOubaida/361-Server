<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>My Laragon</title>
  <style>
    body { font-family: sans-serif; padding: 24px; }
    .choice { margin: 16px 0; }
    .choice label { margin-right: 20px; cursor: pointer; font-size: 16px; }
    button { padding: 10px 20px; margin-right: 8px; cursor: pointer; }
    #status { margin-top: 20px; font-weight: bold; word-break: break-word; }
    .box { margin-top: 24px; padding-top: 16px; border-top: 1px solid #ccc; }
    #wwwPath { font-family: monospace; word-break: break-all; margin: 8px 0 12px; }
    .box button { padding: 6px 14px; }
    #sites { margin: 10px 0; line-height: 1.8; }
    #sites a { color: #0645ad; cursor: pointer; text-decoration: underline; }
    .hint { color: #666; font-size: 13px; }
  </style>
</head>
<body>
  <h2>My Laragon</h2>

  <div class="choice">
    <strong>ওয়েব সার্ভার:</strong><br><br>
    <label><input type="radio" name="server" value="apache" checked> Apache</label>
    <label><input type="radio" name="server" value="nginx"> Nginx</label>
  </div>

  <button id="start">Start</button>
  <button id="stop">Stop</button>
  <p id="status">অপেক্ষা করছে...</p>

  <div class="box">
    <strong>ওয়েবসাইট ফোল্ডার (www):</strong>
    <div id="wwwPath">...</div>
    <button id="changeWww">ফোল্ডার বদলান</button>
    <button id="openWww">ফোল্ডার খুলুন</button>
  </div>

  <div class="box">
    <strong>সাইটসমূহ:</strong>
    <div id="sites">...</div>
    <button id="refreshSites">সাইট রিফ্রেশ</button>
    <p class="hint">www-তে নতুন ফোল্ডার বানালে রিফ্রেশ চাপুন। (এখন শুধু Nginx-এ কাজ করে)</p>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
